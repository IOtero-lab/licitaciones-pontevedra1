name: Comprobar expediente en PLACSP

# Só se lanza a man, dende a pestana "Actions".
on:
  workflow_dispatch:
    inputs:
      expedientes:
        description: "Expedientes a buscar (separados por espazo)"
        required: false
        default: "2625-441 4011/2026"

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Buscar os expedientes nos feeds de hoxe
        run: python comprobar_expediente.py ${{ github.event.inputs.expedientes }}
